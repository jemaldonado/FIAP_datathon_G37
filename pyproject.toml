[project]
name = "datathon-7mlet"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "kaggle>=1.6",
    "python-dotenv>=1.0",
    "mlflow>=2.0",
    "flask>=3.0",
    "flask-cors>=4.0",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/datathon"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
